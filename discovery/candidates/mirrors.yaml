# Job sites the third-party lists link for an added company that its config doesn't read, because they are dead or
# copies: each goes in settings.liveness.aliases (moves.py counts the left one as the right one), so it doesn't raise
# `new job site?` on the company's first morning. stage2_batch.py apply writes the batch's entries.
# An entry with `unreadable` is a site the company's careers page names that no script may read: it goes in
# settings.liveness.watch_unreadable (listed by `internwatch liveness`, never read).
ncino:
  - system: workday:site=ncinocareers,tenant=ncino
    as: greenhouse:board=ncinoinc
    why: its old Workday site, gone from the tenant's robots.txt (which lists only the empty nCinoAgency) and its feed
      answers 403; the careers page links the Greenhouse boards that are read
zscaler:
  - system: lever:site=symmetrysystems
    as: greenhouse:board=zscaler
    why: Symmetry Systems' Lever board, 404 since Zscaler bought the company
conductorone:
  - system: ashby:board=conductorone
    as: ashby:board=c1
    why: its old Ashby board, 404 since the company became C1; the registry still links it
superhuman:
  - system: ashby:board=superhuman
    as: ashby:board=superhuman platform inc
    why: an Ashby board that answers 404; the registry links it, the live board is "Superhuman Platform Inc"
glossgenius:
  - system: greenhouse:board=glossgenius
    as: ashby:board=geniusai
    why: its old Greenhouse board, 404 since it moved to Ashby; SimplifyJobs and its own page still link it
dusty-robotics:
  - system: greenhouse:board=dustyrobotics
    as: rippling:board=dusty-robotics-inc
    why: its old Greenhouse board, 404 since it moved to Rippling; SimplifyJobs and its own page still link it
commure:
  - system: ashby:board=commure-athelas
    as: ashby:board=commure
    why: a second Ashby board its careers page names, 404 on 2026-11-09 and 2026-11-11
progressive:
  - system: ripplematch:company=progressive
    as: ripplematch:company_id=1132
    why: RippleMatch by name = by id
rivian-vw:
  - system: ashby:board=rivianvw
    as: ashby:board=rivianvw.tech
    why: the registry's name for the board, which answers 404; the live board is rivianvw.tech
nike:
  - system: avature:site=nikeats.avature.net/niketalentcommunity
    unreadable: robots.txt blocks it
    why: Nike's talent community on Avature, which its careers page links; its robots.txt disallows every page
northwestern-mutual:
  - system: icims:portal=opportunities-northwesternmutual.icims.com
    unreadable: robots.txt blocks it
    why: the iCIMS portal its careers page links; its robots.txt disallows the job search (Workday and
      SmartRecruiters are read)
applied-materials:
  - system: eightfold:domain=appliedmaterials.com
    as: workday:site=external,tenant=amat
    why: careers.appliedmaterials.com, an Eightfold front over the Workday site that is read (2,222 of its 2,223 jobs were
      on it on 2026-11-13; the other is not a student role)
citi:
  - system: eightfold:domain=citi.eightfold.ai
    as: workday:site=2,tenant=citi
    why: Citi's Eightfold site for events and pre-internship programs, a front over the Workday sites that are read
      (Stage 1, 2026-11-09)
hp:
  - system: eightfold:domain=hp-sandbox.com
    as: workday:site=externalcareersite,tenant=hp
    why: jobs.hp.com, an Eightfold front over HP's Workday site (Stage 1, 2026-11-09)
  - system: eightfold:domain=hp-sandbox.eightfold.ai
    as: workday:site=externalcareersite,tenant=hp
    why: jobs.hp.com, an Eightfold front over HP's Workday site (Stage 1, 2026-11-09)
micron:
  - system: eightfold:domain=micron.com
    as: workday:site=external,tenant=micron
    why: careers.micron.com, an Eightfold front over Micron's Workday site (Stage 1, 2026-11-09)
