  checker: amazon
  settings:
    endpoint: https://www.amazon.jobs/api/jobs/search?is_als=true
    exclude_base:
    - name: businessCategory
      values:
      - {name: a-confidential-job}
    page_size: 200
    queries:
    - jobTypeFacets:
      - name: isIntern
        values:
        - {name: '1'}
      - name: employeeClass
        values:
        - {name: Intern}
        - {name: Apprentice}
    - filterFacets:
      - name: businessCategory
        values:
        - {name: studentprograms}
        - {name: university}
      exclude: [FLAGS]
    - query: intern
      exclude: [FLAGS, BIZ]
      sort: SCORE
    - query: apprentice
      exclude: [FLAGS, BIZ]
      sort: SCORE
    - query: co-op
      exclude: [FLAGS, BIZ]
    - query: student
      exclude: [FLAGS, BIZ]
