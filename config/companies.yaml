# Every company InternWatch watches. One entry per company; see README.md, 'Adding a company'.
#   key, name, category      identity (category 'quant' makes generic titles count as quant roles)
#   careers_url              official careers page first (health emails link it), then your bookmarks
#   checker + settings       which adapter reads the site, and how (src/internwatch/adapters, checkers)
#   locations                countries to match (default from filters.yaml: US)
#   status: blocked          not polled (automated access disallowed); covered by the SimplifyJobs cross-check
#   role_keywords            the company's freshman/sophomore program names (NVIDIA Ignite …): student roles
#   big: true                huge site: newest-first quick scans every poll, a full scan once a day
#   verified                 discovery evidence: the careers page's own job count (and why it differs)
