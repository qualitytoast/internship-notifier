# InternWatch settings. Secrets (SMTP password, healthchecks URL, SSH) live in .env, not here.

email:
  to: "nathan.m.hung@gmail.com"        # where every email goes
  subject_prefix: InternWatch    # subjects: [InternWatch] new roles, [InternWatch Digest], [InternWatch HEALTH], [InternWatch COVERAGE]
  timezone: America/Chicago      # for the digest/report schedule and dates shown in emails
  digest_hour: 8                 # daily digest goes out with the first run at/after this local hour
  report_weekday: 0              # weekly coverage report day (0 = Monday)
  report_hour: 8

schedule:
  # A run starts every 15 minutes (systemd timer). Each company is polled only when due; after
  # each poll its next poll is scheduled a random 30–45 minutes later (jitter). Because runs start
  # every 15 minutes, every site is polled every 30–60 minutes and never more often.
  poll_minutes: [30, 45]
  retry_minutes: [30, 40]        # after a failed poll (each request was already retried with backoff)
  workers: 8                     # companies checked in parallel (one request at a time per host)
  check_timeout_minutes: 8       # time budget for one company's check (per-company timeout_minutes overrides)
  run_timeout_minutes: 25        # hard stop for a whole run (long daily full scans of big sites fit inside)
  full_scan_hours: 24            # big sites (big: true) are read newest-first each poll, fully once a day
  detail_fetch_limit: 40         # max description fetches per company per run (new student roles only)

health:
  alert_after_failures: 2        # consecutive failed polls before a health email (retries happen first)
  drop_threshold: 0.5            # alert if the job count falls by more than this fraction …
  drop_min_baseline: 6           # … from a baseline of at least this many jobs

liveness:                        # boards that go dead, get abandoned or are replaced (src/internwatch/liveness.py)
  enabled: true
  quiet_days: 45                 # a board, of any size, with no new job id for this long is reported
  bleed_days: 30                 # a company under half its highest count of this many days is reported
  unchecked_runs: 2              # a due company never processed in this many runs in a row is reported
  page_scan_days: 7              # careers pages and Workday sites are compared this often (daily runs only) …
  page_scan_seconds: 180         # … within this time budget per run
  # Companies whose careers page answers scripts with a bot check, HTTP 400 or a robots.txt block. The weekly page
  # check leaves them out; src/internwatch/moves.py watches where else they could start posting instead, and its
  # checks read only these companies.
  blocked: [akuna-capital, american-family, capstone, chicago-trading-company, citadel, citadel-securities, coinbase,
            doordash, dropbox, epic-games, expedia, fidelity, general-motors, goldman-sachs, gts, hudson-river-trading,
            liberty-mutual, meta, nutanix, openai, paypal, pinterest, pitchbook, schonfeld, seatgeek, servicenow,
            tower-research, uber, ukg, veeva, whatnot]
  blocked_scan_seconds: 150      # their checks' time budget in each daily run (before the emails)
  extra_tenants:                 # Workday tenants of a parent company, where a new site would show (moves.py W)
    pitchbook: [morningstar.wd5.myworkdayjobs.com]
  wp_pages:                      # WordPress sites whose /wp-json/wp/v2/pages answers: every page is read (moves.py P)
    chicago-trading-company: https://www.chicagotrading.com
    gts: https://gtsx.com
    liberty-mutual: https://jobs.libertymutualgroup.com
  id_pages:                      # pages that link postings by hand: their job ids are compared too (moves.py P)
    tower-research: [https://tower-research.com/internships/]
  job_lists:                     # the job list a company publishes itself (moves.py J): weekly unless every_days says
    # otherwise; match: title where its ids aren't InternWatch's; any_job: report any posting, not only student ones
    akuna-capital: {url: "https://akunacapital.com/wp-content/uploads/akuna_jobs.json", every_days: 1}
    american-family: {url: "https://careers.amfam.com/sitemap.xml"}
    dropbox: {url: "https://www.dropbox.jobs/sitemap.xml"}
    fidelity: {url: "https://jobs.fidelity.com/sitemap.xml"}
    general-motors: {url: "https://search-careers.gm.com/sitemap.xml"}
    nutanix: {url: "https://careers.nutanix.com/sitemap.xml"}
    paypal: {url: "https://paypal.eightfold.ai/careers/sitemap.xml?domain=paypal.com", match: title}
    pinterest: {url: "https://www.pinterestcareers.com/sitemap.xml"}
    servicenow: {url: "https://careers.servicenow.com/sitemap.xml"}
    uber: {url: "https://jobs.uber.com/en/jobs/sitemap.xml", any_job: true}
  parallel_sources:              # boards next to the configured ones, read daily but never stored (moves.py S)
    - {company: akuna-capital, checker: greenhouse, settings: {board: mit}}
    - {company: akuna-capital, checker: greenhouse, settings: {board: optionstrading201course}}
    - {company: akuna-capital, checker: ripplematch, settings: {company_id: 904}}
    - {company: american-family, checker: workday,
       settings: {host: amfam.wd1.myworkdayjobs.com, tenant: amfam, sites: [AmFam-Private, Agent-Staff-Private]}}
    - {company: chicago-trading-company, checker: greenhouse, settings: {board: ctccampusboard}}
    - {company: expedia, checker: ripplematch, settings: {company_id: 1153}}
    - {company: hudson-river-trading, checker: greenhouse, settings: {board: hrtcampus}}
    - {company: liberty-mutual, checker: icims, settings: {portal: "https://campus-libertymutual.icims.com"}}
    - {company: seatgeek, checker: greenhouse, settings: {board: sgcampusrecruiting}}
    - {company: ukg, checker: ripplematch, settings: {company_id: 926}}
  listings:                      # third-party lists and board registries, read weekly (moves.py L)
    - {name: simplify, format: simplify, label: SimplifyJobs,
       url: "https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/.github/scripts/listings.json"}
    - {name: vansh, format: simplify, label: "vanshb03's list",
       url: "https://raw.githubusercontent.com/vanshb03/Summer2027-Internships/dev/.github/scripts/listings.json"}
    - {name: speedyapply, format: markdown, label: speedyapply,
       url: "https://raw.githubusercontent.com/speedyapply/2027-SWE-College-Jobs/main/README.md"}
    - {name: sndsh, format: markdown, label: "sndsh404's list",
       url: "https://raw.githubusercontent.com/sndsh404/summer-2027-internships/main/README.md"}
    - {name: registry, format: registry, label: "zshah101's board registry",
       url: "https://raw.githubusercontent.com/zshah101/Automated-List-Of-Summer-2027-and-Fall-2026-Tech-Internships/main/data/companies.json"}
    - {name: boardsweep, format: boardsweep, label: Boardsweep,
       url: "https://raw.githubusercontent.com/Boardsweep/summer-2027-internships/main/listings.json"}
    - {name: trackr-finance, format: trackr, label: Trackr,
       url: "https://api.the-trackr.com/programmes?region=US&industry=Finance&season=2027&type=summer-internships"}
    - {name: trackr-finance-insight, format: trackr, label: Trackr,
       url: "https://api.the-trackr.com/programmes?region=US&industry=Finance&season=2027&type=insight-programs"}
    - {name: trackr-tech, format: trackr, label: Trackr,
       url: "https://api.the-trackr.com/programmes?region=US&industry=Tech&season=2027&type=summer-internships"}
    - {name: trackr-tech-offcycle, format: trackr, label: Trackr,
       url: "https://api.the-trackr.com/programmes?region=US&industry=Tech&season=2027&type=off-cycle-internships"}
    - {name: ripplematch, format: ripplematch, label: "RippleMatch's company list",
       url: "https://app.ripplematch.com/sitemap.xml"}
  getro:                         # Getro boards that copy a company's jobs from its own careers page (moves.py L)
    - {company: seatgeek, board: "https://jobs.accel.com", path: "/companies/seatgeek/"}
    - {company: openai, board: "https://jobs.thrivecap.com", path: "/companies/openai-3-3b1ed8d5-5b3a-45b4-af49-e30a27910b3b/"}
  program_pages:                 # new student and program pages (moves.py N): sitemaps, wp:<site> page lists, feeds
    akuna-capital: ["https://akunacapital.com/page-sitemap.xml"]
    capstone: ["wp:https://www.capstoneco.com"]
    chicago-trading-company: ["https://www.chicagotrading.com/page-sitemap.xml"]
    citadel: ["https://www.citadel.com/page-sitemap.xml"]
    citadel-securities: ["https://www.citadelsecurities.com/page-sitemap.xml"]
    goldman-sachs: ["https://www.goldmansachs.com/feeds/programs-and-internships.json"]
    gts: ["https://gtsx.com/page-sitemap.xml"]
    liberty-mutual: ["https://jobs.libertymutualgroup.com/page-sitemap.xml"]
    openai: ["https://openai.com/sitemap.xml/page/"]
    tower-research: ["https://tower-research.com/page-sitemap.xml"]
  archive_paths:                 # archive.org (moves.py A): `list` paths whose newly saved student pages are listed
    # (any_page: every new page; ids: the job id in a page's URL), `pages` whose newest copy is read for the systems
    capstone: {pages: ["https://www.capstoneco.com/careers/"]}
    coinbase: {list: ["coinbase.com/careers*"], ids: '/positions/(\d{6,})'}
    doordash: {list: ["careersatdoordash.com/jobs/*", "careersatdoordash.com/university-careers*"],
               ids: '/jobs/[\w-]+/(\d{6,})'}
    expedia: {pages: ["https://careers.expediagroup.com/jobs/"]}
    fidelity: {pages: ["https://jobs.fidelity.com/en/jobs/"]}
    hudson-river-trading: {list: ["hudsonrivertrading.com/careers*", "hudsonrivertrading.com/student-opportunities*"],
                           pages: ["https://www.hudsonrivertrading.com/careers/",
                                   "https://www.hudsonrivertrading.com/student-opportunities/"]}
    meta: {list: ["metacareers.com/careerprograms*"], any_page: true}   # every page there is a program page
    openai: {pages: ["https://openai.com/careers/search/", "https://openai.com/careers/emerging-talent/"]}
    pitchbook: {pages: ["https://pitchbook.com/careers"]}
    uber: {pages: ["https://jobs.uber.com/en/jobs/"]}
    ukg: {list: ["ukg.com/company/careers*"], pages: ["https://www.ukg.com/company/careers"]}
    veeva: {pages: ["https://careers.veeva.com/job-search-results/"]}
    whatnot: {list: ["whatnot.com/careers*"], pages: ["https://www.whatnot.com/careers"]}
  archive_max_days: 45           # an older copy says nothing about where the company posts now
  aliases:                       # one job system under two names (moves.py): the left one counts as the right one
    eightfold:domain=libertymutual.eightfold.ai: eightfold:domain=libertymutual.com
    eightfold:domain=ukg.eightfold.ai: eightfold:domain=ukg.com
    eightfold:domain=apply.ukg.com: eightfold:domain=ukg.com
    eightfold:domain=paypal.eightfold.ai: workday:site=jobs,tenant=paypal   # PayPal's Eightfold site mirrors Workday
    eightfold:domain=paypal.com: workday:site=jobs,tenant=paypal
    oracle:host=iaziqy.fa.ocs.oraclecloud.com,site=cx_1: oracle:host=iaziqy.fa.ocs.oraclecloud.com,site=ubercareers
    ripplematch:company=akuna-capital: ripplematch:company_id=904                 # RippleMatch by name = by id
    ripplematch:company=expedia-group: ripplematch:company_id=1153
    ripplematch:company=ukg-ultimate-kronos-group: ripplematch:company_id=926
    ripplematch:company=mongodb: ripplematch:company_id=825
    # mirrors the October 2026 audit proved: nearly all their jobs are stored, or it is the same system by another name
    workday:site=bh_externalcareers,tenant=brevanhoward: 'phenom:'   # brevan-howard
    workday:site=apply,tenant=ebay: 'phenom:'   # ebay
    ripplematch:company=ebay: 'ripplematch:company_id=865'   # ebay
    ripplematch:company=epic: 'epic-careers:'   # epic-systems
    workday:site=nvidiaexternalcareersite,tenant=nvidia: 'eightfold:domain=nvidia.com'   # nvidia
    eightfold:domain=nvidia.eightfold.ai: 'eightfold:domain=nvidia.com'   # nvidia
    ripplematch:company=palo-alto-networks: 'ripplematch:company_id=676'   # palo-alto-networks
    ripplematch:company=plaid: 'ripplematch:company_id=718'   # plaid
    ripplematch:company=rockwell-automation: 'ripplematch:company_id=671'   # rockwell-automation
    ripplematch:company=hubspot: 'ripplematch:company_id=708'   # hubspot
    ripplematch:company=peak6: 'workday:site=apexfintechsolutions,tenant=peak6group'   # peak6
    workday:site=salesforce_research,tenant=salesforce: 'workday:site=external_career_site,tenant=salesforce'   # salesforce
    workday:site=futureforce_newgradroles,tenant=salesforce: 'workday:site=external_career_site,tenant=salesforce'   # salesforce
    workday:site=slack,tenant=salesforce: 'workday:site=external_career_site,tenant=salesforce'   # salesforce
    ashby:board=snowflake: 'phenom:'   # snowflake
    workday:site=ccicareers,tenant=osv-cci: 'workday:site=ccicareers,tenant=osv_cci'   # castleton-commodities
    eightfold:domain=johndeere.eightfold.ai: 'eightfold:domain=johndeere.com'   # john-deere
    icims:portal=hubcareers-docusign.icims.com: 'jibe:host=careers.docusign.com'   # docusign
    icims:portal=uscareers-docusign.icims.com: 'jibe:host=careers.docusign.com'   # docusign
    icims:portal=careers-sig.icims.com: 'jibe:host=careers.sig.com'   # sig
    avature:site=twosigma.avature.net: 'avature:site=careers.twosigma.com'   # two-sigma
    avature:site=ibmglobal.avature.net: 'ibm:'   # ibm
    oracle:host=eeho.fa.us2.oraclecloud.com,site=cx_1: 'oracle:host=eeho.fa.us2.oraclecloud.com,site=cx_45001'   # oracle
    greenhouse:board=instabase: 'instabase:board=instabase'   # instabase

crosscheck:
  grace_minutes: 90              # wait this long (and for a fresh poll) before calling a Simplify role a miss
  sources:                       # listings.json: what SimplifyJobs' README and Off-Season README are built from, and more
    - name: summer
      url: https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/.github/scripts/listings.json
      page: https://github.com/SimplifyJobs/Summer2027-Internships/blob/dev/README.md

http:
  connect_timeout: 10
  read_timeout: 30
  retries: 3                     # retries with exponential backoff (2 s, 6 s, 18 s + jitter)
  min_interval: 1.0              # seconds between two requests to the same host
  respect_robots: true

paths:
  db: data/internwatch.db
  outbox: data/outbox            # every email is also saved here as .eml + .html
  logs: data/logs
  robots_cache: data/robots
  fixtures: tests/fixtures/cassettes
