# InternWatch settings. Secrets (SMTP password, healthchecks URL, SSH) live in .env, not here.

email:
  to: "nathan.m.hung@gmail.com"        # where every email goes
  subject_prefix: InternWatch    # subjects: [InternWatch] new roles, [InternWatch Digest], [InternWatch HEALTH], [InternWatch COVERAGE]
  timezone: America/Chicago      # for the digest/report schedule and dates shown in emails
  digest_hour: 8                 # daily digest goes out with the first run at/after this local hour
  report_weekday: 0              # weekly coverage report day (0 = Monday)
  report_hour: 8

schedule:
  # A run starts every 15 minutes (systemd timer). Each company is polled only when due; after
  # each poll its next poll is scheduled a random 30–45 minutes later (jitter). Because runs start
  # every 15 minutes, every site is polled every 30–60 minutes and never more often.
  poll_minutes: [30, 45]
  retry_minutes: [30, 40]        # after a failed poll (each request was already retried with backoff)
  workers: 8                     # companies checked in parallel (one request at a time per host)
  check_timeout_minutes: 8       # time budget for one company's check (per-company timeout_minutes overrides)
  run_timeout_minutes: 25        # hard stop for a whole run (long daily full scans of big sites fit inside)
  full_scan_hours: 24            # big sites (big: true) are read newest-first each poll, fully once a day
  detail_fetch_limit: 40         # max description fetches per company per run (new student roles only)

health:
  alert_after_failures: 2        # consecutive failed polls before a health email (retries happen first)
  drop_threshold: 0.5            # alert if the job count falls by more than this fraction …
  drop_min_baseline: 6           # … from a baseline of at least this many jobs
  reminder_hours: 24             # remind about a still-open problem this often

liveness:                        # boards that go dead, get abandoned or are replaced (src/internwatch/liveness.py)
  enabled: true
  source_reminder_days: 7        # remind about a board that stays empty this often
  stale_days: 45                 # a board with no new posting for this long …
  stale_gap_factor: 3            # … and for 3× its usual gap between postings is reported as stale
  stale_min_dated: 20            # (only boards listing at least this many dated postings: small boards post in bursts)
  stale_reminder_days: 14
  unchecked_runs: 2              # a due company never processed in this many runs in a row is reported
  page_scan_days: 7              # careers pages and Workday sites are compared this often (daily runs only) …
  page_scan_seconds: 180         # … within this time budget per run
  # Companies whose careers page answers scripts with a bot check, HTTP 400 or a robots.txt block. The weekly page
  # check leaves them out; src/internwatch/moves.py watches where else they could start posting instead, and its
  # checks read only these companies.
  blocked: [akuna-capital, american-family, capstone, chicago-trading-company, citadel, citadel-securities, coinbase,
            doordash, dropbox, epic-games, expedia, fidelity, general-motors, goldman-sachs, gts, hudson-river-trading,
            liberty-mutual, meta, nutanix, openai, paypal, pinterest, pitchbook, schonfeld, seatgeek, servicenow,
            tower-research, uber, ukg, veeva, whatnot]
  blocked_scan_seconds: 150      # their checks' time budget in each daily run (before the emails)
  extra_tenants:                 # Workday tenants of a parent company, where a new site would show (moves.py W)
    pitchbook: [morningstar.wd5.myworkdayjobs.com]
  wp_pages:                      # WordPress sites whose /wp-json/wp/v2/pages answers: every page is read (moves.py P)
    chicago-trading-company: https://www.chicagotrading.com
    gts: https://gtsx.com
    liberty-mutual: https://jobs.libertymutualgroup.com
  id_pages:                      # pages that link postings by hand: their job ids are compared too (moves.py P)
    tower-research: [https://tower-research.com/internships/]
  job_lists:                     # the job list a company publishes itself (moves.py J): weekly unless every_days says
    # otherwise; match: title where its ids aren't InternWatch's; any_job: report any posting, not only student ones
    akuna-capital: {url: "https://akunacapital.com/wp-content/uploads/akuna_jobs.json", every_days: 1}
    american-family: {url: "https://careers.amfam.com/sitemap.xml"}
    dropbox: {url: "https://www.dropbox.jobs/sitemap.xml"}
    fidelity: {url: "https://jobs.fidelity.com/sitemap.xml"}
    general-motors: {url: "https://search-careers.gm.com/sitemap.xml"}
    nutanix: {url: "https://careers.nutanix.com/sitemap.xml"}
    paypal: {url: "https://paypal.eightfold.ai/careers/sitemap.xml?domain=paypal.com", match: title}
    pinterest: {url: "https://www.pinterestcareers.com/sitemap.xml"}
    servicenow: {url: "https://careers.servicenow.com/sitemap.xml"}
    uber: {url: "https://jobs.uber.com/en/jobs/sitemap.xml", any_job: true}
  archive_paths:                 # archive.org (moves.py A): `list` paths whose newly saved pages are listed (with the
    # job id in a page's URL, `ids`), and `pages` whose newest copy is read for the job systems it names
    capstone: {pages: ["https://www.capstoneco.com/careers/"]}
    coinbase: {list: ["coinbase.com/careers*"], ids: '/positions/(\d{6,})'}
    doordash: {list: ["careersatdoordash.com/jobs/*", "careersatdoordash.com/university-careers*"],
               ids: '/jobs/[\w-]+/(\d{6,})'}
    expedia: {pages: ["https://careers.expediagroup.com/jobs/"]}
    fidelity: {pages: ["https://jobs.fidelity.com/en/jobs/"]}
    hudson-river-trading: {list: ["hudsonrivertrading.com/careers*", "hudsonrivertrading.com/student-opportunities*"],
                           pages: ["https://www.hudsonrivertrading.com/careers/",
                                   "https://www.hudsonrivertrading.com/student-opportunities/"]}
    meta: {list: ["metacareers.com/careerprograms*"]}
    openai: {pages: ["https://openai.com/careers/search/", "https://openai.com/careers/emerging-talent/"]}
    pitchbook: {pages: ["https://pitchbook.com/careers"]}
    uber: {pages: ["https://jobs.uber.com/en/jobs/"]}
    ukg: {list: ["ukg.com/company/careers*"], pages: ["https://www.ukg.com/company/careers"]}
    veeva: {pages: ["https://careers.veeva.com/job-search-results/"]}
    whatnot: {list: ["whatnot.com/careers*"], pages: ["https://www.whatnot.com/careers"]}
  archive_max_days: 45           # an older copy says nothing about where the company posts now
  aliases:                       # one job system under two names (moves.py): the left one counts as the right one
    eightfold:domain=libertymutual.eightfold.ai: eightfold:domain=libertymutual.com
    eightfold:domain=ukg.eightfold.ai: eightfold:domain=ukg.com
    eightfold:domain=apply.ukg.com: eightfold:domain=ukg.com
    eightfold:domain=paypal.eightfold.ai: workday:site=jobs,tenant=paypal   # PayPal's Eightfold site mirrors Workday
    eightfold:domain=paypal.com: workday:site=jobs,tenant=paypal
    oracle:host=iaziqy.fa.ocs.oraclecloud.com,site=cx_1: oracle:host=iaziqy.fa.ocs.oraclecloud.com,site=ubercareers

crosscheck:
  grace_minutes: 90              # wait this long (and for a fresh poll) before calling a Simplify role a miss
  sources:
    - name: summer
      url: https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/README.md
      page: https://github.com/SimplifyJobs/Summer2027-Internships/blob/dev/README.md
    - name: offseason
      url: https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/README-Off-Season.md
      page: https://github.com/SimplifyJobs/Summer2027-Internships/blob/dev/README-Off-Season.md

http:
  connect_timeout: 10
  read_timeout: 30
  retries: 3                     # retries with exponential backoff (2 s, 6 s, 18 s + jitter)
  min_interval: 1.0              # seconds between two requests to the same host
  respect_robots: true

paths:
  db: data/internwatch.db
  outbox: data/outbox            # every email is also saved here as .eml + .html
  logs: data/logs
  robots_cache: data/robots
  fixtures: tests/fixtures/cassettes
